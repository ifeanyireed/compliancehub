services:
  - type: web
    name: compliancehub-backend
    env: go
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: go build -o server cmd/api/main.go
    startCommand: ./server
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: "8080"
